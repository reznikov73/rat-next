# Спайк P1 — standalone-пакет вне основного cargo workspace.
[workspace]

[package]
name = "video-loop"
description = "Спайк P1: локальный видео-луп (DXGI -> QSV H.264 -> декод -> показ) с замерами стадий"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
eframe = "0.36"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
] }

[build-dependencies]
cc = "1"
