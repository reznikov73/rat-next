# Спайк — standalone-пакет вне основного cargo workspace.
[workspace]

[package]
name = "dxgi-capture"
description = "Спайк P0: захват экрана через DXGI Desktop Duplication (windows-rs)"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
image = "0.25"
