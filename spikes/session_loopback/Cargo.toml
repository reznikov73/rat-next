# Спайк P2 — standalone-пакет вне основного cargo workspace.
[workspace]

[package]
name = "session-loopback"
description = "Спайк P2: loopback-сессия агент↔вьюер через rat-mux (in-memory duplex)"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
eframe = "0.36"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
] }
prost = "0.13"
rat-mux = { path = "../../crates/mux" }
rat-proto = { path = "../../crates/proto" }

[build-dependencies]
cc = "1"
