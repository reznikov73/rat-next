[package]
name = "rat"
description = "Rat Next — единое приложение: плитки + встроенный сервер + вьюер"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
# Пилотный кодек-путь и GUI (локальная сборка FFmpeg; см. README).
ffmpeg = ["rat-session/ffmpeg", "dep:eframe", "dep:tray-icon"]

[dependencies]
rat-session = { path = "../../crates/session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.36", optional = true }
tray-icon = { version = "0.19", optional = true }

[build-dependencies]
winresource = "0.1"
