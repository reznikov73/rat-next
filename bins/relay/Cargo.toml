[package]
name = "rat-relay"
description = "Rat Next: relay-сервер с окном, треем и монитором подключений"
version.workspace = true
edition.workspace = true
publish = false

[features]
# Окно (egui/eframe) и значок в трее. На Windows включено по умолчанию; на
# серверной Linux-машине без графической сессии собирают
# `--no-default-features` — тогда бинарник работает только в headless-режиме.
default = ["gui"]
gui = ["dep:eframe", "dep:tray-icon"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.36", optional = true }
tray-icon = { version = "0.19", optional = true }
rat-session = { path = "../../crates/session" }

[build-dependencies]
# Встраивание иконки в exe: имеет смысл только для Windows. На других
# платформах build-скрипт выходит сразу (см. build.rs) и крейт не нужен.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
